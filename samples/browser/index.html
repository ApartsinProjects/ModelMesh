<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelMesh Browser Sample</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5; color: #333;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      background: #1a1a2e; color: #fff; padding: 12px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header .badge {
      background: #e94560; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
    }

    .config-panel {
      background: #fff; border-bottom: 1px solid #ddd;
      padding: 12px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: end;
    }
    .config-group { display: flex; flex-direction: column; gap: 4px; }
    .config-group label { font-size: 12px; font-weight: 600; color: #666; }
    .config-group input, .config-group select {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 13px; min-width: 200px;
    }
    .config-group input[type="password"] { min-width: 280px; }
    .config-group.cors-group input { min-width: 260px; }
    .cors-hint { font-size: 11px; color: #999; }

    .chat-container { flex: 1; overflow-y: auto; padding: 20px; }
    .message {
      max-width: 720px; margin: 0 auto 12px; padding: 12px 16px;
      border-radius: 8px; font-size: 14px; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .message.user { background: #e3f2fd; text-align: right; margin-left: auto; }
    .message.assistant { background: #fff; border: 1px solid #e0e0e0; }
    .message.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .message.system { background: #f3e5f5; text-align: center; font-style: italic; font-size: 13px; }

    .input-bar {
      background: #fff; border-top: 1px solid #ddd;
      padding: 12px 20px; display: flex; gap: 10px;
      max-width: 760px; margin: 0 auto; width: 100%;
    }
    .input-bar input {
      flex: 1; padding: 10px 14px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 14px; outline: none;
    }
    .input-bar input:focus { border-color: #1a73e8; }
    .input-bar button {
      padding: 10px 20px; background: #1a73e8; color: #fff;
      border: none; border-radius: 6px; font-size: 14px;
      cursor: pointer; font-weight: 600;
    }
    .input-bar button:hover { background: #1557b0; }
    .input-bar button:disabled { background: #ccc; cursor: not-allowed; }
    .input-bar .stream-toggle { display: flex; align-items: center; gap: 4px; font-size: 12px; }
  </style>
</head>
<body>

<header>
  <h1>ModelMesh</h1>
  <span class="badge">Browser</span>
</header>

<div class="config-panel">
  <div class="config-group">
    <label>Provider</label>
    <select id="provider">
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
      <option value="groq">Groq</option>
      <option value="deepseek">DeepSeek</option>
      <option value="mistral">Mistral</option>
      <option value="openrouter">OpenRouter</option>
      <option value="custom">Custom (OpenAI-compatible)</option>
    </select>
  </div>

  <div class="config-group">
    <label>Model</label>
    <input id="model" type="text" placeholder="e.g. gpt-4o-mini" />
  </div>

  <div class="config-group">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." />
  </div>

  <div class="config-group cors-group">
    <label>CORS Proxy URL <span class="cors-hint">(leave empty for direct access)</span></label>
    <input id="proxyUrl" type="text" placeholder="http://localhost:9090" />
  </div>

  <div class="config-group" id="customBaseUrlGroup" style="display:none">
    <label>Base URL</label>
    <input id="customBaseUrl" type="text" placeholder="https://api.example.com" />
  </div>
</div>

<div class="chat-container" id="chat">
  <div class="message system">
    Enter your API key and send a message to start chatting.
    <br>For CORS support, run: <code>node tools/cors-proxy/cors-proxy.js</code>
    <br>Or use without proxy if calling from a browser extension or CORS-enabled API.
  </div>
</div>

<div class="input-bar">
  <div class="stream-toggle">
    <input type="checkbox" id="streamToggle" checked />
    <label for="streamToggle">Stream</label>
  </div>
  <input id="messageInput" type="text" placeholder="Type a message..." />
  <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>
  // -- Provider configs -------------------------------------------------------

  const PROVIDERS = {
    openai: {
      baseUrl: 'https://api.openai.com',
      defaultModel: 'gpt-4o-mini',
      endpoint: '/v1/chat/completions',
      authHeader: (key) => ({ Authorization: `Bearer ${key}` }),
    },
    anthropic: {
      baseUrl: 'https://api.anthropic.com',
      defaultModel: 'claude-sonnet-4-20250514',
      endpoint: '/v1/messages',
      authHeader: (key) => ({
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      }),
      transformRequest: (messages, model) => ({
        model,
        max_tokens: 1024,
        messages: messages.map(m => ({ role: m.role, content: m.content })),
      }),
      transformResponse: (data) => data.content?.[0]?.text ?? '',
      transformStreamLine: (line) => {
        if (!line.startsWith('data: ')) return null;
        const json = line.substring(6).trim();
        if (json === '[DONE]') return null;
        try {
          const d = JSON.parse(json);
          if (d.type === 'content_block_delta') return d.delta?.text ?? '';
          return null;
        } catch { return null; }
      },
    },
    groq: {
      baseUrl: 'https://api.groq.com/openai',
      defaultModel: 'llama-3.1-8b-instant',
      endpoint: '/v1/chat/completions',
      authHeader: (key) => ({ Authorization: `Bearer ${key}` }),
    },
    deepseek: {
      baseUrl: 'https://api.deepseek.com',
      defaultModel: 'deepseek-chat',
      endpoint: '/v1/chat/completions',
      authHeader: (key) => ({ Authorization: `Bearer ${key}` }),
    },
    mistral: {
      baseUrl: 'https://api.mistral.ai',
      defaultModel: 'mistral-small-latest',
      endpoint: '/v1/chat/completions',
      authHeader: (key) => ({ Authorization: `Bearer ${key}` }),
    },
    openrouter: {
      baseUrl: 'https://openrouter.ai/api',
      defaultModel: 'openai/gpt-4o-mini',
      endpoint: '/v1/chat/completions',
      authHeader: (key) => ({ Authorization: `Bearer ${key}` }),
    },
    custom: {
      baseUrl: '',
      defaultModel: '',
      endpoint: '/v1/chat/completions',
      authHeader: (key) => ({ Authorization: `Bearer ${key}` }),
    },
  };

  // -- UI refs ----------------------------------------------------------------

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const providerEl = document.getElementById('provider');
  const modelEl = document.getElementById('model');
  const apiKeyEl = document.getElementById('apiKey');
  const proxyUrlEl = document.getElementById('proxyUrl');
  const customBaseUrlGroup = document.getElementById('customBaseUrlGroup');
  const customBaseUrlEl = document.getElementById('customBaseUrl');
  const streamToggle = document.getElementById('streamToggle');

  const conversationHistory = [];

  // -- Provider selection handler ---------------------------------------------

  providerEl.addEventListener('change', () => {
    const prov = PROVIDERS[providerEl.value];
    modelEl.value = prov.defaultModel;
    customBaseUrlGroup.style.display = providerEl.value === 'custom' ? '' : 'none';
  });

  // Initialize model field
  modelEl.value = PROVIDERS[providerEl.value].defaultModel;

  // Enter key sends message
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // -- Chat logic -------------------------------------------------------------

  function addMessage(role, content, cls) {
    const div = document.createElement('div');
    div.className = `message ${cls || role}`;
    div.textContent = content;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function resolveUrl(targetUrl) {
    const proxy = proxyUrlEl.value.trim().replace(/\/+$/, '');
    if (proxy) {
      return `${proxy}/${targetUrl}`;
    }
    return targetUrl;
  }

  async function sendMessage() {
    const content = inputEl.value.trim();
    if (!content) return;

    const apiKey = apiKeyEl.value.trim();
    if (!apiKey) {
      addMessage('error', 'Please enter your API key.', 'error');
      return;
    }

    const providerKey = providerEl.value;
    const provider = PROVIDERS[providerKey];
    const model = modelEl.value.trim() || provider.defaultModel;
    const useStream = streamToggle.checked;

    const baseUrl = providerKey === 'custom'
      ? customBaseUrlEl.value.trim().replace(/\/+$/, '')
      : provider.baseUrl;

    if (!baseUrl) {
      addMessage('error', 'Please enter a Base URL for custom provider.', 'error');
      return;
    }

    // Add user message
    addMessage('user', content);
    conversationHistory.push({ role: 'user', content });
    inputEl.value = '';
    sendBtn.disabled = true;

    const targetUrl = `${baseUrl}${provider.endpoint}`;
    const url = resolveUrl(targetUrl);

    const headers = {
      'Content-Type': 'application/json',
      ...provider.authHeader(apiKey),
    };

    // Build request body
    let body;
    if (provider.transformRequest) {
      body = provider.transformRequest(conversationHistory, model);
      if (useStream) body.stream = true;
    } else {
      body = {
        model,
        messages: conversationHistory,
        stream: useStream,
      };
    }

    try {
      if (useStream) {
        await handleStreamingResponse(url, headers, body, provider);
      } else {
        await handleNonStreamingResponse(url, headers, body, provider);
      }
    } catch (err) {
      addMessage('error', `Error: ${err.message}`, 'error');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function handleNonStreamingResponse(url, headers, body, provider) {
    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 300)}`);
    }

    const data = await response.json();

    let text;
    if (provider.transformResponse) {
      text = provider.transformResponse(data);
    } else {
      text = data.choices?.[0]?.message?.content ?? JSON.stringify(data);
    }

    addMessage('assistant', text);
    conversationHistory.push({ role: 'assistant', content: text });
  }

  async function handleStreamingResponse(url, headers, body, provider) {
    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 300)}`);
    }

    const msgDiv = addMessage('assistant', '', 'assistant');
    let fullText = '';

    if (!response.body) {
      // Fallback: no streaming support, read entire response
      const data = await response.json();
      let text;
      if (provider.transformResponse) {
        text = provider.transformResponse(data);
      } else {
        text = data.choices?.[0]?.message?.content ?? '';
      }
      msgDiv.textContent = text;
      conversationHistory.push({ role: 'assistant', content: text });
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        let chunk = null;

        if (provider.transformStreamLine) {
          chunk = provider.transformStreamLine(trimmed);
        } else {
          // Standard OpenAI SSE format
          if (!trimmed.startsWith('data: ')) continue;
          const dataStr = trimmed.substring(6).trim();
          if (dataStr === '[DONE]') continue;
          try {
            const parsed = JSON.parse(dataStr);
            chunk = parsed.choices?.[0]?.delta?.content ?? null;
          } catch { /* ignore malformed */ }
        }

        if (chunk) {
          fullText += chunk;
          msgDiv.textContent = fullText;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      }
    }

    if (!fullText) {
      msgDiv.textContent = '(empty response)';
    }
    conversationHistory.push({ role: 'assistant', content: fullText });
  }
</script>

</body>
</html>
