<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a6dd4;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#1a6dd4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1a6dd4;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1a3a5c" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
  </g>

  <!-- Mesh network lines (connections between nodes) -->
  <g stroke="#1e90ff" stroke-width="1" opacity="0.15">
    <!-- Left cluster -->
    <line x1="80" y1="120" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="280" y2="160"/>
    <line x1="80" y1="120" x2="160" y2="200"/>
    <line x1="160" y1="200" x2="280" y2="160"/>
    <line x1="200" y1="80" x2="350" y2="120"/>
    <line x1="280" y1="160" x2="350" y2="120"/>
    <line x1="160" y1="200" x2="120" y2="300"/>
    <line x1="120" y1="300" x2="240" y2="320"/>
    <line x1="240" y2="320" y1="320" x2="280" y2="160"/>
    <line x1="350" y1="120" x2="420" y2="200"/>
    <!-- Right cluster -->
    <line x1="920" y1="100" x2="1040" y2="80"/>
    <line x1="1040" y1="80" x2="1120" y2="160"/>
    <line x1="920" y1="100" x2="980" y2="200"/>
    <line x1="980" y1="200" x2="1120" y2="160"/>
    <line x1="1120" y1="160" x2="1200" y2="120"/>
    <line x1="1200" y1="120" x2="1200" y2="240"/>
    <line x1="1200" y1="240" x2="1120" y2="300"/>
    <line x1="1120" y1="300" x2="980" y2="280"/>
    <line x1="980" y1="280" x2="980" y2="200"/>
    <line x1="920" y1="100" x2="860" y2="180"/>
    <line x1="860" y1="180" x2="920" y2="280"/>
    <line x1="920" y1="280" x2="980" y2="280"/>
    <!-- Cross connections -->
    <line x1="420" y1="200" x2="640" y2="160" stroke-opacity="0.08"/>
    <line x1="640" y1="160" x2="860" y2="180" stroke-opacity="0.08"/>
    <line x1="240" y1="320" x2="640" y2="300" stroke-opacity="0.06"/>
    <line x1="640" y1="300" x2="1120" y2="300" stroke-opacity="0.06"/>
  </g>

  <!-- Glow nodes (left) -->
  <g filter="url(#nodeGlow)" opacity="0.6">
    <circle cx="80" cy="120" r="4" fill="#4db8ff"/>
    <circle cx="200" cy="80" r="3" fill="#4db8ff"/>
    <circle cx="280" cy="160" r="5" fill="#00d4ff"/>
    <circle cx="160" cy="200" r="3" fill="#4db8ff"/>
    <circle cx="350" cy="120" r="4" fill="#4db8ff"/>
    <circle cx="120" cy="300" r="3" fill="#4db8ff"/>
    <circle cx="240" cy="320" r="3" fill="#00d4ff"/>
    <circle cx="420" cy="200" r="4" fill="#4db8ff"/>
  </g>
  <!-- Glow nodes (right) -->
  <g filter="url(#nodeGlow)" opacity="0.6">
    <circle cx="920" cy="100" r="4" fill="#4db8ff"/>
    <circle cx="1040" cy="80" r="3" fill="#4db8ff"/>
    <circle cx="1120" cy="160" r="5" fill="#00d4ff"/>
    <circle cx="980" cy="200" r="3" fill="#4db8ff"/>
    <circle cx="1200" cy="120" r="4" fill="#4db8ff"/>
    <circle cx="1200" cy="240" r="3" fill="#4db8ff"/>
    <circle cx="1120" cy="300" r="3" fill="#00d4ff"/>
    <circle cx="980" cy="280" r="4" fill="#4db8ff"/>
    <circle cx="860" cy="180" r="3" fill="#4db8ff"/>
    <circle cx="920" cy="280" r="3" fill="#4db8ff"/>
  </g>

  <!-- Solid nodes (left) -->
  <g>
    <circle cx="80" cy="120" r="2.5" fill="#69c0ff"/>
    <circle cx="200" cy="80" r="2" fill="#69c0ff"/>
    <circle cx="280" cy="160" r="3" fill="#91d5ff"/>
    <circle cx="160" cy="200" r="2" fill="#69c0ff"/>
    <circle cx="350" cy="120" r="2.5" fill="#69c0ff"/>
    <circle cx="120" cy="300" r="2" fill="#69c0ff"/>
    <circle cx="240" cy="320" r="2" fill="#91d5ff"/>
    <circle cx="420" cy="200" r="2.5" fill="#69c0ff"/>
  </g>
  <!-- Solid nodes (right) -->
  <g>
    <circle cx="920" cy="100" r="2.5" fill="#69c0ff"/>
    <circle cx="1040" cy="80" r="2" fill="#69c0ff"/>
    <circle cx="1120" cy="160" r="3" fill="#91d5ff"/>
    <circle cx="980" cy="200" r="2" fill="#69c0ff"/>
    <circle cx="1200" cy="120" r="2.5" fill="#69c0ff"/>
    <circle cx="1200" cy="240" r="2" fill="#69c0ff"/>
    <circle cx="1120" cy="300" r="2" fill="#91d5ff"/>
    <circle cx="980" cy="280" r="2.5" fill="#69c0ff"/>
    <circle cx="860" cy="180" r="2" fill="#69c0ff"/>
    <circle cx="920" cy="280" r="2" fill="#69c0ff"/>
  </g>

  <!-- Center horizontal glow -->
  <rect x="300" y="170" width="680" height="60" fill="url(#glow)" rx="30"/>

  <!-- Main title -->
  <text x="640" y="195" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="3">
    ModelMesh
  </text>

  <!-- Subtitle -->
  <text x="640" y="235" text-anchor="middle" fill="#8cb4d8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="4">
    CAPABILITY-DRIVEN AI MODEL ROUTING
  </text>

  <!-- Feature tags -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a9cc5" letter-spacing="1">
    <text x="430" y="275" text-anchor="middle">AUTOMATIC FAILOVER</text>
    <text x="640" y="275" text-anchor="middle">FREE-TIER AGGREGATION</text>
    <text x="850" y="275" text-anchor="middle">MULTI-PROVIDER ROUTING</text>
  </g>

  <!-- Decorative dots between tags -->
  <circle cx="535" cy="272" r="2" fill="#2a6090"/>
  <circle cx="745" cy="272" r="2" fill="#2a6090"/>

  <!-- Top and bottom accent lines -->
  <rect x="440" y="140" width="400" height="1" fill="#1e90ff" opacity="0.2" rx="0.5"/>
  <rect x="460" y="295" width="360" height="1" fill="#1e90ff" opacity="0.15" rx="0.5"/>
</svg>
