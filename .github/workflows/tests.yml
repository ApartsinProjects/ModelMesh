name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Python lint (ruff)
        run: pip install ruff && cd src/python && ruff check .
      - name: Python type check (mypy)
        run: pip install mypy && cd src/python && mypy modelmesh --ignore-missing-imports --no-error-summary || true
      - name: TypeScript lint (tsc --noEmit)
        run: npm ci && npm run --workspace src/typescript lint
      - name: Version consistency check
        run: |
          PY_VER=$(grep '^version' src/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TS_VER=$(node -p "require('./src/typescript/package.json').version")
          echo "Python: $PY_VER, TypeScript: $TS_VER"
          [ "$PY_VER" = "$TS_VER" ] || { echo "ERROR: Version mismatch!"; exit 1; }

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-asyncio
      - run: cd src/python && python -m pytest ../../tests/ -v

  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci && npm test --workspace src/typescript

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t modelmesh-proxy:test .
      - name: Verify image runs
        run: |
          docker run --rm modelmesh-proxy:test --help 2>&1 || true
